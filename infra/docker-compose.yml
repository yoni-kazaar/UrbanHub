services:
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/minio:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_METEO_SECRET: ${MINIO_METEO_SECRET}
      MINIO_VELOS_SECRET: ${MINIO_VELOS_SECRET}
      MINIO_POLLUTION_SECRET: ${MINIO_POLLUTION_SECRET}
      MINIO_CROISE_SECRET: ${MINIO_CROISE_SECRET}
    volumes:
      - ./init.sh:/init.sh:ro
      - ./policies:/policies:ro
    entrypoint: ["/bin/sh", "/init.sh"]

volumes:
  minio-data:
